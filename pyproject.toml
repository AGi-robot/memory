[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-memory"
version = "0.1.0"
description = "The AGi memory framework: one contract, pluggable backends (journal, sqlite, vector), conformance-tested"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["memory/src"]
